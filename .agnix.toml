# agnix (github.com/agent-sh/agnix) runs in CI only: .github/workflows/ci.yml.
# Every disabled rule names why it is a false positive for this repository.
exclude = [
  ".git/**",
]

[rules]
disabled_rules = [
  # XML-001: prose placeholders such as <plan>, <topic> and <What this skill refuses> are not XML.
  "XML-001",
  # XP-003: ~/.founder-os/, ~/.claude/ and /Users/x/ name the plugin's own data dirs and documented examples.
  "XP-003",
  # CC-AG-005: agents preload this plugin's own skills (founder-os/skills/), which agnix does not resolve.
  "CC-AG-005",
]

# CC-SK-006: relationship-map only writes network.md in the workspace and sends nothing; it must stay
# model-invocable for "before a conference" and "cold outreach proposed".
[[overrides]]
paths = ["founder-os/skills/relationship-map/SKILL.md"]
disabled_rules = ["CC-SK-006"]

# Root AGENTS.md is the contributor file; its context is founder-os/references/guidance.md, which it names.
[[overrides]]
paths = ["AGENTS.md"]
disabled_rules = ["AGM-004"]

# XP-006: CLAUDE.md only imports AGENTS.md (@AGENTS.md), so there is one instruction layer.
[[overrides]]
paths = ["AGENTS.md", "CLAUDE.md"]
disabled_rules = ["XP-006"]

[tool_versions]
claude_code = "2.1.300"
