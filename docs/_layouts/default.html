<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f2eee4">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self';">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <title>{{ page.title | default: site.title }} — Founder OS</title>
  <!-- One layout for every Markdown guide: no theme, no script, no other origin (docs/pitfalls.md). -->
  <style>
    :root {
      --paper: #f2eee4;
      --paper-strong: #fffaf0;
      --ink: #122127;
      --ink-soft: #526064;
      --line: rgba(18, 33, 39, 0.2);
      --orange: #f15a35;
      --code: rgba(18, 33, 39, 0.06);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #102025;
        --paper-strong: #16292f;
        --ink: #f2eee4;
        --ink-soft: #b5bfbf;
        --line: rgba(242, 238, 228, 0.2);
        --code: rgba(242, 238, 228, 0.08);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font: 17px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    header, main, footer { max-width: 760px; margin: 0 auto; padding: 0 16px; }
    header { display: flex; gap: 16px; align-items: baseline; padding-top: 20px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
    header a { color: var(--ink); text-decoration: none; }
    header strong a { font-weight: 700; }
    header nav { display: flex; gap: 14px; flex-wrap: wrap; font-size: 15px; }
    main { padding-top: 8px; padding-bottom: 48px; overflow-wrap: break-word; }
    a { color: var(--orange); }
    h1, h2, h3 { line-height: 1.25; }
    pre, code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.88em; }
    code { background: var(--code); padding: 0.1em 0.3em; border-radius: 4px; }
    pre { background: var(--paper-strong); border: 1px solid var(--line); padding: 12px; overflow-x: auto; border-radius: 6px; }
    pre code { background: none; padding: 0; }
    table { border-collapse: collapse; display: block; overflow-x: auto; }
    th, td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; }
    blockquote { margin: 0; padding-left: 14px; border-left: 3px solid var(--orange); color: var(--ink-soft); }
    footer { padding-bottom: 32px; color: var(--ink-soft); font-size: 14px; border-top: 1px solid var(--line); padding-top: 12px; }
  </style>
</head>
<body>
  <header>
    <strong><a href="{{ '/' | relative_url }}">Founder OS</a></strong>
    <nav>
      <a href="{{ '/README.html' | relative_url }}">Docs</a>
      <a href="{{ '/getting-started.html' | relative_url }}">Getting started</a>
      <a href="{{ '/commands.html' | relative_url }}">Commands</a>
      <a href="{{ '/trust.html' | relative_url }}">Trust</a>
      <a href="{{ '/changelog.html' | relative_url }}">Changelog</a>
    </nav>
  </header>
  <main>
{{ content }}
  </main>
  <footer>
    {% if page.last-verified %}Last verified {{ page.last-verified | date: "%Y-%m-%d" }} · {% endif %}<a href="https://github.com/msolecki/founder-os/blob/main/{% if page.source %}{{ page.source }}{% else %}docs/{{ page.path }}{% endif %}">Source</a>
  </footer>
</body>
</html>
