name: Report a problem
description: A workflow errored, denied, or wrote the wrong thing — or ran cleanly and the result was wrong
title: "[report] "
labels: ["report"]
body:
  - type: markdown
    attributes:
      value: |
        Founder OS reads and writes your own Markdown files, and those files are
        yours. **Do not paste workspace contents here.** Naming a path is useful
        — `metrics.md`, `pipeline.md ## Live`. Naming a client, an amount or a
        revenue figure is not, and this form is public.

        `/founder-os-feedback` fills this in for you from the session that went
        wrong, and refuses to copy a number out of your workspace while it does.
  - type: dropdown
    id: kind
    attributes:
      label: What happened
      description: >-
        The split is mechanical, not a judgement: did the workflow finish? One
        of these is a defect with a stack trace behind it; the other is the
        report almost nobody sends, because nothing was broken enough to feel
        worth the form — and it is the one that says the product is wrong rather
        than merely broken.
      options:
        - It errored, was denied, or wrote the wrong bytes
        - It completed and the result was wrong or useless
    validations:
      required: true
  - type: dropdown
    id: workflow
    attributes:
      label: Which workflow
      description: The skill that was running. The full catalogue is in founder-os/COMMANDS.md.
      options:
        - annual-review
        - assumption-audit
        - audience-research
        - automation-audit
        - bet-sizing
        - calendar-audit
        - capacity-check
        - capture
        - client-health
        - content-draft
        - content-plan
        - context-load
        - daily-brief
        - dashboard
        - decision-log
        - delivery-retro
        - energy-audit
        - experiment
        - follow-up-sweep
        - founder-os-doctor
        - founder-os-feedback
        - founder-os-init
        - guardrails
        - icp-definition
        - ingestion-gate
        - kill-or-continue
        - learning-plan
        - monthly-review
        - offer-design
        - outreach-draft
        - pipeline-review
        - portfolio-review
        - premortem
        - pricing-strategy
        - profitability-analysis
        - proposal-draft
        - quarterly-planning
        - queue
        - rate-raise
        - red-team
        - relationship-map
        - revenue-review
        - runway-forecast
        - scope-guard
        - setup-cadences
        - signal-check
        - situation-review
        - skill-forge
        - skill-gap
        - state-integrity
        - strategic-evaluation
        - tool-stack-review
        - triage
        - voice-capture
        - week-plan
        - weekly-review
        - win-loss-analysis
    validations:
      required: true
  - type: dropdown
    id: host
    attributes:
      label: Host
      options:
        - Claude Code
        - Codex
        - Both
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Plugin version
      description: The first line of `/founder-os-doctor`, or the `version` field in `founder-os/.claude-plugin/plugin.json`.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected it to do
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What it did instead
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: /founder-os-doctor output
      description: >-
        Run `/founder-os-doctor` and paste the report. It names paths and
        structural findings, never file contents. Optional on purpose — an
        install broken enough to need reporting is an install that may not be
        able to run it, and a required field there would have turned the worst
        bugs into no report at all.
      render: text
    validations:
      required: false
