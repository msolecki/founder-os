# The Traffic API keeps fourteen days and then the data is gone. A month of
# history — including the launch week — already is. This turns the sliding
# window into a series.
#
# The series lives on the orphan `metrics` branch, never on main, because this
# repository is also the plugin marketplace: every commit on main reaches every
# installed copy on the next `/plugin marketplace update`. Fifty-two commits a
# year of analytics in the product package is bandwidth the founder's users pay
# for. The branch has no shared history with main and never merges into it.
name: traffic-snapshot

on:
  schedule:
    # Weekly is enough with a fourteen-day API window: one failed run still
    # leaves a week of slack before a day would be lost.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: traffic-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    # A fork has no traffic of its own to keep and no `metrics` branch to push.
    if: github.repository == 'msolecki/founder-os'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the scripts from the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          # The series is pushed from the second checkout below, which hands
          # git the token per step, from the environment. Leaving it in this one's git config is a
          # credential nothing reads.
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      # The Traffic API needs Administration: read, which GITHUB_TOKEN cannot be
      # granted, so the reads use a fine-grained token (docs/development.md).
      # The push below stays on github.token and its `contents: write`.
      - name: Read the Traffic API
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p api
          gh api "repos/${GITHUB_REPOSITORY}/traffic/clones" > api/clones.json
          gh api "repos/${GITHUB_REPOSITORY}/traffic/views" > api/views.json
          gh api "repos/${GITHUB_REPOSITORY}" > api/repository.json
          gh api "repos/${GITHUB_REPOSITORY}/traffic/popular/referrers" > api/referrers.json
          gh api "repos/${GITHUB_REPOSITORY}/traffic/popular/paths" > api/paths.json
          # The one number here that is unambiguously a person. `type:issue`
          # excludes pull requests, which the REST `open_issues_count` field
          # famously does not. Same fourteen-day window as the traffic API so
          # the two backfill together.
          since="$(date -u -d '13 days ago' +%F)"
          echo "ISSUES_SINCE=${since}" >> "$GITHUB_ENV"
          # --paginate, because a single page silently truncates and this is
          # the one column in the file that is unambiguously a person. An
          # undercount here is worse than a gap: it reads as a quiet fortnight.
          gh api -X GET search/issues --paginate \
            -f q="repo:${GITHUB_REPOSITORY} type:issue created:>=${since}" \
            -f per_page=100 \
            --jq '[.items[].created_at]' \
            | python3 -c 'import json,sys; print(json.dumps([t for page in sys.stdin.read().split("\n") if page.strip() for t in json.loads(page)]))' \
            > api/issues.json

      - name: Check out the series, creating the orphan branch on first run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p series
          cd series
          git init -q
          # The token rides in an http.extraheader set from the environment for
          # this step only, never in the remote URL, so nothing writes it into
          # series/.git/config.
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth=1 origin metrics; then
            git checkout -q FETCH_HEAD
            git switch -q -c metrics
          else
            echo "no metrics branch yet — starting one with no history"
            git checkout -q --orphan metrics
          fi

      - name: Merge today's reading into the series
        run: |
          set -euo pipefail
          python3 source/scripts/traffic_snapshot.py \
            --clones api/clones.json \
            --views api/views.json \
            --repository api/repository.json \
            --issues api/issues.json \
            --issues-since "${ISSUES_SINCE}" \
            --referrers api/referrers.json \
            --paths api/paths.json \
            --out series/metrics/traffic.csv \
            --date "$(date -u +%F)"

      - name: Report what the series now says
        run: python3 source/scripts/traffic_report.py series/metrics/traffic.csv

      - name: Commit and push the series
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd series
          # Referrer and path snapshots are photographs and accumulate at two a
          # week. A year of them is noise in the directory and in the glob the
          # report walks, and nothing reads one older than the report window.
          python3 ../source/scripts/prune_snapshots.py metrics --keep 8
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git commit -q -m "chore(metrics): traffic snapshot $(date -u +%F)"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git push -q origin metrics
