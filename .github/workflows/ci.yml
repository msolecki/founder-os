name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels its older run; runs on main always finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # The state gateway relies on fcntl and dir_fd, and macOS is the main user platform.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - run: pip install pyyaml==6.0.3
      - name: Validate the package
        run: python3 scripts/validate_package.py founder-os
      - name: Check COMMANDS.md is current
        run: python3 scripts/generate_commands.py founder-os --check
      - name: Check local links and anchors
        run: python3 scripts/check_local_links.py
      - name: Smoke-test an installed copy
        run: python3 scripts/smoke_installed_copy.py
      - name: Run the tests
        run: python3 -m unittest discover -s tests -v
      - name: Run landing behavior tests
        run: node --test tests/*.behavior.test.js

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      # Static lint of skills, agents, hooks and plugin manifests; settings and suppressions in .agnix.toml.
      # The binary is pinned by its own hash, not by a checksum file from the same release.
      - name: agnix
        run: |
          curl -sSfL -o agnix.tar.gz https://github.com/agent-sh/agnix/releases/download/v0.57.0/agnix-x86_64-unknown-linux-gnu.tar.gz
          echo "c72bf5ff1f45900055c353cc1bd6bbea6389506a3ba3197db000340066c78098  agnix.tar.gz" | sha256sum -c -
          tar -xzf agnix.tar.gz agnix
          rm agnix.tar.gz
          ./agnix --target claude-code --strict --config .agnix.toml .
          rm agnix
      # --ignore-scripts skips every dependency's lifecycle script; only Claude Code's own postinstall,
      # which links its native binary, runs, by name.
      - name: Install Claude Code
        run: |
          npm install -g --ignore-scripts @anthropic-ai/claude-code@2.1.300
          node "$(npm root -g)/@anthropic-ai/claude-code/install.cjs"
          claude --version
      # --strict fails on unknown or misspelled manifest keys and on any warning.
      - name: claude plugin validate
        run: |
          for d in . founder-os; do
            claude plugin validate "$d" --strict
          done
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/
          rm gitleaks.tar.gz
      - name: gitleaks over the pull request's commits
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # A pull request must not loosen its own scan.
          if git diff --name-only "$BASE" "$HEAD" | grep -E '(^|/)\.gitleaks(\.toml|ignore)$'; then
            echo "gitleaks configuration changed in this pull request; a maintainer reviews it by hand" >&2; exit 1
          fi
          if git diff "$BASE" "$HEAD" | grep -E '^\+.*gitleaks:allow'; then
            echo "this pull request adds a gitleaks:allow marker; a maintainer reviews it by hand" >&2; exit 1
          fi
          gitleaks git --no-banner --redact --log-opts="$BASE..$HEAD" .
      # Scan only what git tracks, not ignored local files.
      - name: gitleaks over tracked files
        run: |
          tmp=$(mktemp -d)
          git ls-files -z | rsync -a --from0 --files-from=- . "$tmp"
          gitleaks dir --no-banner --redact "$tmp"
