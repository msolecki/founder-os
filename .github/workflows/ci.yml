name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - run: pip install pyyaml==6.0.3
      - name: Validate the package
        run: python3 scripts/validate_package.py founder-os
      - name: Check COMMANDS.md is current
        run: python3 scripts/generate_commands.py founder-os --check
      - name: Check local links and anchors
        run: python3 scripts/check_local_links.py
      - name: Smoke-test an installed copy
        run: python3 scripts/smoke_installed_copy.py
      - name: Run the tests
        run: python3 -m unittest discover -s tests -v
      - name: Run landing behavior tests
        run: node --test tests/*.behavior.test.js
